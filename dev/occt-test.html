<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCascade box test</title>
<style>
  body { font: 14px/1.45 system-ui, sans-serif; margin: 0; background: #1d1c1a; color: #eee; display: grid; grid-template-columns: 1fr 380px; height: 100vh; }
  #view { position: relative; }
  aside { padding: 14px; overflow: auto; border-left: 1px solid #333; }
  pre { white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; background: #111; padding: 10px; border-radius: 6px; }
  button { font: inherit; padding: 6px 10px; margin: 0 6px 6px 0; border-radius: 6px; border: 1px solid #555; background: #2a2926; color: #eee; cursor: pointer; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script>document.write('<script src="../geometry.js?v=' + Date.now() + '"><\/script>')</script>
</head>
<body>
<div id="view"></div>
<aside>
  <h3 style="margin-top:0">OpenCascade stage 2</h3>
  <div id="btns"></div>
  <pre id="out">Loading…</pre>
</aside>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const OC = await import('../occt.js?v=' + Date.now());
const G = window.MBG, out = document.getElementById('out');
const log = s => { out.textContent += s + '\n'; console.log('[occt]', s); };
out.textContent = '';
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true }); view.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1d1c1a);
const camera = new THREE.PerspectiveCamera(35, 1, 1, 5000); camera.up.set(0, 0, 1); camera.position.set(140, -160, 140);
const controls = new OrbitControls(camera, renderer.domElement); controls.target.set(0, 32, 25);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.1)); const dl = new THREE.DirectionalLight(0xffffff, 1.4); dl.position.set(80, -120, 200); scene.add(dl);
const resize = () => { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); };
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
let shown = null;
function show(shape) {
  if (shown) scene.remove(shown);
  const m = OC.mesh(shape, 0.03), g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(m.vertices, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(m.normals, 3));
  g.setIndex(m.triangles);
  shown = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0xe8e2d8, roughness: .6, side: THREE.DoubleSide }));
  scene.add(shown);
  return m.triangles.length / 3;
}
const CASES = [
  ['plain body (stage 1)', {}, 'body'],
  ['standard box with slots', {}],
  ['3 cells, 2 dividers, label', { cells: [64.5, 64.5, 64.5], dividers: 2, label: 'front', label_text: 'M3 BOLTS' }],
  ['C2 front, handle notch', G.positionParams('C2', 3, 1)],
  ['C1 back, case corner, embossed back label', Object.assign(G.positionParams('C1', 1, 1), { label: 'back', label_text: 'TAPE', label_style: 'emboss' })],
  ['front corner DL', G.positionParams('DL', 3, 1)],
  ['2 cells, tray (grid) + wall mount', { cells: [64.5, 64.5], tray: true, wall_mount: true }],
  ['wall 2.5, 3 across', { wall: 2.5, divider_cols: 2 }],
];
const built = {};
window.T = { results: [], built, OC, G };
const sum = (o, k) => o[k] ? o[k].volume() : 0;
(async () => {
  try {
    log('occt.js build: ' + (OC.BUILD || 'old'));
    const k = await OC.initOCCT(log);
    log(`kernel ready in ${k.seconds.toFixed(1)} s`);
    for (const [name, prm, mode] of CASES) {
      try {
        const t0 = performance.now();
        let shapes, ref;
        if (mode === 'body') {
          shapes = { box: OC.buildBody(G, prm).body };
          ref = { box: G.build(Object.assign({}, prm, { slots: 'none' })).box };
        } else { shapes = OC.build(G, prm); ref = G.build(prm); }
        const secs = (performance.now() - t0) / 1000;
        const parts = ['box', 'tray', 'mount'].filter(x => shapes[x]);
        const row = { name, seconds: +secs.toFixed(2) };
        for (const x of parts) {
          const v = OC.volume(shapes[x]), r = sum(ref, x);
          row[x] = `${(v / 1000).toFixed(2)} vs ${(r / 1000).toFixed(2)} cm3 (${((v - r) / r * 100).toFixed(2)}%)`;
        }
        T.results.push(row); built[name] = shapes;
        log(`${name}: ${row.seconds}s\n   ` + parts.map(x => x + ' ' + row[x]).join('\n   '));
        const b = document.createElement('button'); b.textContent = name;
        b.onclick = () => log(`${name}: ${show(shapes.box)} display triangles`);
        document.getElementById('btns').appendChild(b);
      } catch (e) { T.results.push({ name, error: String(e && e.message || e) }); log(`${name}: FAILED ${e && e.message || e}`); console.error(e); }
    }
    const pick = built['2 cells, tray (grid) + wall mount'] || built['standard box with slots'];
    if (pick) {
      log(`display triangles: ${show(pick.box)}`);
      const parts = ['box', 'tray', 'mount'].filter(x => pick[x]).map(x => ({ shape: pick[x], name: x }));
      const step = OC.stepFile(parts), txt = await step.text();
      T.step = { bytes: step.size, solids: (txt.match(/MANIFOLD_SOLID_BREP/g) || []).length, cylinders: (txt.match(/CYLINDRICAL_SURFACE/g) || []).length,
        cones: (txt.match(/CONICAL_SURFACE/g) || []).length, planes: (txt.match(/\bPLANE\(/g) || []).length, bsplines: (txt.match(/B_SPLINE_SURFACE/g) || []).length };
      log('STEP (tray + mount box): ' + JSON.stringify(T.step));
      const d = document.createElement('button'); d.textContent = 'Download STEP (box + tray + mount)';
      d.onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(step); a.download = 'occt-stage2.step'; a.click(); };
      document.getElementById('btns').appendChild(d);
    }
    T.done = true; log('done');
  } catch (e) { T.error = String(e && e.stack || e); log('ERROR ' + T.error); T.done = true; }
})();
</script>
</body>
</html>
